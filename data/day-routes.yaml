      - {label: 东莞住处, detail: "06:00预约送机出发"}
      - {label: 广州白云机场T3, detail: "约07:10到达；直进安检和登机口", url: "https://uri.amap.com/search?keyword=广州白云国际机场T3航站楼&city=广州"}
