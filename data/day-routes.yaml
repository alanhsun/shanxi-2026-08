    note: 全程顺路向南；雁门关北门进，县城住宿避免景区溢价。
    stops:
      - {label: 大同酒店, detail: "06:35装车出发", url: "https://uri.amap.com/search?keyword=万信至格酒店大同百盛明堂公园店&city=大同"}
      - {label: 恒山游客中心, detail: "换官方景交看悬空寺", url: "https://uri.amap.com/search?keyword=恒山景区游客中心&city=大同"}
      - {label: 应县木塔, detail: "午餐、外观与首层", url: "https://uri.amap.com/search?keyword=应县木塔&city=朔州"}
      - {label: 雁门关北门, detail: "核心关城约2小时", url: "https://uri.amap.com/search?keyword=雁门关景区北门&city=忻州"}
