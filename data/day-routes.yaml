  - day_id: day-02
    title: D2 云冈石窟与大同古城
    note: 约10:00打车至云冈，下午单向进入古城；游览结束才取车回酒店。
    stops:
      - {label: 大同酒店, detail: "09:55打车出发", url: "https://uri.amap.com/search?keyword=万信至格酒店大同百盛明堂公园店&city=大同"}
      - {label: 云冈石窟, detail: "11:05入园；5、6、20窟优先，排队跳看", url: "https://uri.amap.com/search?keyword=云冈石窟游客中心&city=大同"}
      - {label: 华严寺, detail: "下午核心慢游", url: "https://uri.amap.com/search?keyword=华严寺景区入口&city=大同"}
      - {label: 神州租车大同古城服务点, detail: "约16:35取车验车", url: "https://uri.amap.com/search?keyword=神州租车大同古城服务点&city=大同"}
