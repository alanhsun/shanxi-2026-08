    note: D4已完成三座核心寺院；D5不再新增寺院，休整后直接南下太原。
    stops:
      - {label: 妙隐居民宿, detail: "早餐、整理行李", url: "https://uri.amap.com/search?keyword=妙隐居民宿五台山&city=忻州"}
      - {label: 台怀镇, detail: "10:45午餐、取车退房", url: "https://uri.amap.com/search?keyword=台怀镇&city=忻州"}
